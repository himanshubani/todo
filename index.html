<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code&family=Merriweather&family=Montserrat:wght@200;400&family=Parisienne&family=Rokkitt&family=Sacramento&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <h1 class="title">Stuff I need to do</h1>
    <div class="all-tasks">
      <h2 class="task-list-title">My lists</h2>
      <ul class="task-list" data-lists>
        <!-- <li class="list-name active-list">Youtube</li>
        <li class="list-name">Work</li>
        <li class="list-name">Shopping</li> -->
      </ul>
      <form class="add-task-form" 
        action=""
        data-new-list-form
      >
        <input
          data-new-list-input
          type="text"
          class="new list"
          placeholder="new list name"
          aria-label="new list name"
        />
        <button class="btn create list" aria-label="create new list">+</button>
      </form>
    </div>
        
    <div class="todo-list" data-list-display-container>
        <div class="todo-header">
          <h2 class="list-title" data-list-title>Youtube</h2>
          <p class="task-count" data-list-count>3 Tasks remaining</p>
        </div>
        <div class="todo-body">
            <div class="tasks" data-tasks>
              
              <!-- end of task-2 --> 
              
              <!-- end of task-3 -->
            </div>
          <div class="new-task-creator">
            <form data-new-task-form>
              <input
                data-new-task-input
                type="text"
                class="new task"
                placeholder="new task name"
                aria-label="new task name"
              />
              <button class="btn create list" aria-label="create new task">+</button>
            </form>
          </div>
          <div class="delete-stuff">
              <button class="btn delete" data-clear-complete-tasks-button>Clear completed tasks</button>
              <button class="btn delete" data-delete-list-button>Delete list</button>
          </div>
        </div>
    </div>
    <template id="task-template">
      <div class="task">
        <input type="checkbox" />
        <label >
          <span class="custom-checkbox"> </span>
        </label
        >
      </div>
    </template>
  </body>
</html>
