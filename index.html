<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code&family=Merriweather&family=Montserrat:wght@200;400&family=Parisienne&family=Rokkitt&family=Sacramento&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="title">Stuff I need to do</h1>
    <div class="all-tasks">
      <h2 class="task-list-title">My lists</h2>
      <ul class="task-list">
        <li class="list-name">Youtube</li>
        <li class="list-name">Work</li>
        <li class="list-name">Shopping</li>
      </ul>
      <form class="add-task-form">
        <input
          type="text"
          class="new list"
          placeholder="new list name"
          aria-label="new list name"
        />
        <button class="btn list" aria-label="create new list">+</button>
      </form>
    </div>
        
    <div class="todo-list">
        <div class="todo-header">
          <h2 class="list-title">Youtube</h2>
          <p class="task-count">3 Tasks remaining</p>
        </div>
        <div class="todo-body">
          <div class="tasks">
            <div class="tasks">
              <div class="task">
                <input type="checkbox" class="task-checkbox" id="task-1" />
                <label for="task-1" class="task-name">
                  <span class="custom-checkbox"> </span>
                  Watch a movie</label
                >
              </div>
              <!-- end of task-1 -->
              <div class="task">
                <input type="checkbox" class="task-checkbox" id="task-2" />
                <label for="task-2" class="task-name">
                  <span class="custom-checkbox"> </span>
                  Watch a movie</label
                >
              </div>
              <!-- end of task-2 -->
              <div class="task">
                <input type="checkbox" class="task-checkbox" id="task-3" />
                <label for="task-3" class="task-name">
                  <span class="custom-checkbox"> </span>
                  Watch a movie</label
                >
              </div>
              <!-- end of task-3 -->
            </div>
          </div>
          <div class="new-task-creator">
            <form class="add-task-form">
              <input
                type="text"
                class="new task"
                placeholder="new task name"
                aria-label="new task name"
              />
              <button class="btn create list" aria-label="create new task">+</button>
            </form>
          </div>
          <div class="delete-stuff">
              <button class="btn delete">Clear completed tasks</button>
              <button class="btn delete">Delete list</button>
          </div>
        </div>
    </div>
  </body>
</html>
